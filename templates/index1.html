<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selective Zoom App</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <h1 class="text-center mb-4">Selective Zoom Application</h1>
        <form method="POST" enctype="multipart/form-data" class="bg-white p-4 rounded shadow-sm">
          <div class="mb-3">
            <label for="file" class="form-label">Select Image:</label>
            <input type="file" class="form-control" id="file" name="file" accept="image/*" required>
          </div>
          <div class="mb-3">
            <label for="zoom" class="form-label">Zoom Factor (1.0–3.0):</label>
            <input type="number" class="form-control" id="zoom" name="zoom" min="1.0" max="3.0" step="0.1" value="1.5" required>
          </div>
          {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
          {% endif %}
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Process Image</button>
          </div>
        </form>

        {% if original_url and result_url %}
        <div class="row mt-4">
          <div class="col-12 col-sm-6 mb-3">
            <div class="card">
              <div class="card-header text-center">Original Image</div>
              <div class="card-body text-center">
                <img src="{{ original_url }}" alt="Original Image" class="img-fluid rounded">
              </div>
            </div>
          </div>
          <div class="col-12 col-sm-6 mb-3">
            <div class="card">
              <div class="card-header text-center">Result (Zoom: {{ zoom_factor }}x)</div>
              <div class="card-body text-center">
                <img src="{{ result_url }}" alt="Processed Image" class="img-fluid rounded">
              </div>
            </div>
          </div>
        </div>
        {% endif %}

      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
